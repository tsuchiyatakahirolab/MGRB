name: qgis-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qgis:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - qgis/qgis:3.44.12
          - qgis/qgis:4.2.0
    steps:
      - uses: actions/checkout@v4
      - name: Headless PyQGIS smoke test
        run: >-
          docker run --rm
          -e QT_QPA_PLATFORM=offscreen
          -v "$PWD:/workspace"
          -w /workspace
          ${{ matrix.image }}
          python3 scripts/qgis_smoke.py
      - name: Build synthetic QGIS project and publication layout
        run: >-
          docker run --rm
          -e QT_QPA_PLATFORM=offscreen
          -v "$PWD:/workspace"
          -w /workspace
          ${{ matrix.image }}
          bash -lc 'python3 scripts/make_qgis_fixture.py && python3 scripts/build_qgis_projects.py --derived outputs/qgis-fixture/derived --output outputs/qgis-fixture/qgis && test -s outputs/qgis-fixture/qgis/test_region.qgz && test -s outputs/qgis-fixture/qgis/previews/test_region.pdf'
