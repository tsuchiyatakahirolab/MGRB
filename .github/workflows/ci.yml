name: core-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Doctor
        run: python -m mgrb.cli doctor
      - name: Tests
        run: pytest -q
      - name: Lint
        run: ruff check mgrb scripts tests
      - name: Public boundary including reachable history
        run: python scripts/check_public_boundary.py --git-ref HEAD --git-ref origin/main
