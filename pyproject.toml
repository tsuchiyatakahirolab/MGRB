[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mgrb"
version = "1.0.0"
description = "A reproducible, QGIS-ready geospatial base for maritime research"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Takahiro Tsuchiya"}]
license = {text = "Apache-2.0"}
keywords = ["QGIS", "GIS", "maritime", "bathymetry", "reproducible-research", "cartography"]
dependencies = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "PyYAML>=6.0",
  "jsonschema>=4.20"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mgrb = "mgrb.cli:main"

[tool.setuptools]
packages = ["mgrb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
